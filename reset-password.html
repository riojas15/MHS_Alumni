<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password | Martin Alumni</title><link rel="stylesheet" href="assets/style.css"></head>
<body>
<header class="site-header"><div class="container"><a class="brand" href="index.html">Martin Alumni</a></div></header>
<main class="container narrow">
  <div class="card">
    <h2>Reset your password</h2>
    <p class="muted">Choose a new password for your account.</p>
    <form id="reset-password-form">
      <label>New password<input id="password" type="password" minlength="8" required autocomplete="new-password"></label>
      <label>Confirm new password<input id="confirm_password" type="password" minlength="8" required autocomplete="new-password"></label>
      <button class="button full" type="submit">Update password</button>
      <p id="message" class="message"></p>
    </form>
    <p class="center"><a href="login.html">Back to login</a></p>
  </div>
</main>
<script type="module" src="js/config.js"></script>
<script type="module" src="js/reset-password.js"></script>
</body></html>
